# Experimental Python 3.12 / Linux x86_64 PDF environment.
# Keep unrelated Curator extras on the root project's existing environment.
[project]
name = "curator-nrl-pdf-environment"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nemo-curator[interleaved_cpu,lance]",
    "nemo-retriever[nemotron-parse]",
    "torch==2.11.0+cu130",
    "torchvision==0.26.0+cu130",
    "vllm==0.25.1",
    "transformers==5.17.0",
    "flashinfer-python==0.6.13",
    "flashinfer-cubin==0.6.13",
    "ray==2.57.0",
    "nvidia-ml-py",
    "psutil",
    "albumentations==2.0.8",
    "einops",
    "easydict",
    "addict",
    "tritonclient",
    "apscheduler>=3.10.0"
]

[dependency-groups]
validation = ["pytest", "pytest-asyncio", "pytest-mock", "pytest-loguru", "pytest-cov", "pytest-httpserver"]

[tool.uv]
required-version = ">=0.12.1"
package = false
default-groups = []
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Carry security floors from both roots as constraints, without dependency overrides.
constraint-dependencies = [
    "aiohttp>=3.13.3",
    "cryptography>=46.0.6",
    "lxml-html-clean>=0.4.5",
    "nbconvert>=7.17.0",
    "pillow>=12.1.1",
    "protobuf>=5.29.6",
    "pyasn1>=0.6.2",
    "pyopenssl>=26.0.0",
    "python-multipart>=0.0.22",
    "starlette>=0.49.1",
    "urllib3>=2.8.0",
    "wandb>=0.30.0",
    "wheel>=0.46.2",
    "transformers>=5.17.0,<6",
    "cryptography>=50.0.1",
    "packaging>=25",
    "setuptools>=80.10.1",
    "xgrammar>=0.1.32",
    "langsmith>=0.8.18",
    "msgpack>=1.2.1",
    "aiohttp>=3.14.3",
    "requests>=2.33.0",
    "idna>=3.15",
    "pydantic-settings>=2.14.2",
    "nltk>=3.10.3",
    "litellm>=1.102.0rc2",
    "pillow>=12.3.0"
]

[tool.uv.sources]
nemo-curator = { path = "wheels/nemo_curator-1.5.0-py3-none-any.whl" }
nemo-retriever = { path = "wheels/nemo_retriever-2026.10.21.dev20261021033248-py3-none-any.whl" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
